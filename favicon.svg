<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo Gradiente Cyan/Oscuro -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111622" />
      <stop offset="100%" stop-color="#080b10" />
    </linearGradient>

    <!-- Gradiente para el Escudo (Oro y Cian) -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ffb703" />
    </linearGradient>

    <!-- Brillo Neón -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Cuadrado con bordes redondeados -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="12" />

  <!-- Escudo Gaming / CoC -->
  <path d="M256 80 L380 140 V260 C380 340 310 400 256 430 C202 400 132 340 132 260 V140 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="24" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Detalle Central (Rayo/Espada estilizada) -->
  <path d="M256 160 L280 240 L256 230 L232 240 Z M256 250 L270 330 L256 350 L242 330 Z" 
        fill="#ffb703" />
</svg>
